name: Publicar imágenes

on:
  workflow_dispatch:
  push:
    branches:
      - fix/rule-B5

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  OWNER: jesusro-del

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: web/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.OWNER }}/perfil-web:1.0

      - uses: docker/build-push-action@v6
        with:
          context: ./api
          file: api/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.OWNER }}/perfil-api:1.0

      - name: Hacer públicas las imágenes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for pkg in perfil-web perfil-api; do
            gh api --method PATCH \
              -H "Accept: application/vnd.github+json" \
              "/user/packages/container/${pkg}" \
              -f visibility=public
          done
